<!-- Schema.org - WebSite -->
<script type="application/ld+json">
{
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "{{ site.title }}",
    "alternateName": ["認知作戰防禦網", "Cognitive Warfare Defense Taiwan"],
    "url": "{{ site.url }}",
    "description": "{{ site.description }}",
    "inLanguage": "zh-TW"
}
</script>

<!-- Schema.org - Organization -->
<script type="application/ld+json">
{
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "{{ site.title }}",
    "url": "{{ site.url }}",
    "logo": "{{ site.og_image | absolute_url }}",
    "description": "致力於認知作戰研究與民主防衛教育的非營利資訊平台",
    "areaServed": {
        "@type": "Country",
        "name": "Taiwan"
    }
}
</script>

<!-- Schema.org - WebPage (當前頁面) -->
<script type="application/ld+json">
{
    "@context": "https://schema.org",
    "@type": "WebPage",
    "name": "{{ page.title | default: site.title }}",
    "description": "{{ page.description | default: site.description }}",
    "url": "{{ page.url | absolute_url }}",
    "inLanguage": "zh-TW",
    "isPartOf": {
        "@type": "WebSite",
        "name": "{{ site.title }}",
        "url": "{{ site.url }}"
    }
}
</script>

<!-- Schema.org - BreadcrumbList -->
{% if page.breadcrumb %}
<script type="application/ld+json">
{
    "@context": "https://schema.org",
    "@type": "BreadcrumbList",
    "itemListElement": [
        {
            "@type": "ListItem",
            "position": 1,
            "name": "首頁",
            "item": "{{ site.url }}"
        },
        {
            "@type": "ListItem",
            "position": 2,
            "name": "{{ page.title }}",
            "item": "{{ page.url | absolute_url }}"
        }
    ]
}
</script>
{% endif %}

<!-- 頁面特定 Schema -->
{{ page.schema }}
