<script>
// 水平滾動控制
function scrollSlides(slideshowId, direction) {
    const container = document.querySelector(`[data-slideshow="${slideshowId}"] .slides-wrapper`);
    const scrollAmount = 200;
    container.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
}

// 燈箱功能
let currentLightboxSlideshow = null;
let currentLightboxIndex = 0;
let lightboxImages = [];

function openLightbox(slideshowId, index) {
    currentLightboxSlideshow = slideshowId;
    currentLightboxIndex = index;

    const container = document.querySelector(`[data-slideshow="${slideshowId}"]`);
    const images = container.querySelectorAll('.slide img');
    lightboxImages = Array.from(images).map(img => img.src);

    updateLightboxImage();
    document.getElementById('lightbox').classList.add('active');
    document.body.style.overflow = 'hidden';
}

function closeLightbox() {
    document.getElementById('lightbox').classList.remove('active');
    document.body.style.overflow = '';
}

function updateLightboxImage() {
    document.getElementById('lightbox-img').src = lightboxImages[currentLightboxIndex];
    document.getElementById('lightbox-current').textContent = currentLightboxIndex + 1;
    document.getElementById('lightbox-total').textContent = lightboxImages.length;
}

function lightboxNav(direction) {
    currentLightboxIndex += direction;
    if (currentLightboxIndex >= lightboxImages.length) currentLightboxIndex = 0;
    if (currentLightboxIndex < 0) currentLightboxIndex = lightboxImages.length - 1;
    updateLightboxImage();
}

// 鍵盤導航
document.addEventListener('keydown', function(e) {
    const lightbox = document.getElementById('lightbox');
    if (lightbox.classList.contains('active')) {
        if (e.key === 'ArrowLeft') lightboxNav(-1);
        if (e.key === 'ArrowRight') lightboxNav(1);
        if (e.key === 'Escape') closeLightbox();
    }
});

// 點擊燈箱背景關閉
document.getElementById('lightbox').addEventListener('click', function(e) {
    if (e.target === this) closeLightbox();
});

// 燈箱觸控滑動
document.getElementById('lightbox').addEventListener('touchstart', function(e) {
    this.startX = e.touches[0].clientX;
});
document.getElementById('lightbox').addEventListener('touchend', function(e) {
    const diff = this.startX - e.changedTouches[0].clientX;
    if (Math.abs(diff) > 50) {
        lightboxNav(diff > 0 ? 1 : -1);
    }
});
</script>
