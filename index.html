    <script>
    $(document).ready(function() {

        // 禁用 jQuery AJAX 緩存
        $.ajaxSetup({
            cache: false
        });

        // ===== Hero 區塊動畫系統 =====

        // 數字計數動畫
        function animateCounter(element) {
            const target = parseInt(element.dataset.target);
            const suffix = element.dataset.suffix || '';
            const format = element.dataset.format || '';
            const duration = 2000;
            const startTime = performance.now();

            element.classList.add('counting');

            function updateCounter(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);

                // easeOutExpo
                const easeProgress = 1 - Math.pow(2, -10 * progress);
                const current = Math.floor(easeProgress * target);

                // 格式化數字
                let displayValue;
                if (format === 'short' && current >= 1000000) {
                    displayValue = (current / 1000000).toFixed(1) + 'M';
                } else if (format === 'short' && current >= 1000) {
                    displayValue = (current / 1000).toFixed(0) + 'K';
                } else {
                    displayValue = current.toLocaleString();
                }

                element.textContent = displayValue + suffix;

                if (progress < 1) {
                    requestAnimationFrame(updateCounter);
                } else {
                    element.classList.remove('counting');
                    // 最終顯示值
                    if (format === 'short' && target >= 1000000) {
                        element.textContent = (target / 1000000).toFixed(1) + 'M' + suffix;
                    } else {
                        element.textContent = target.toLocaleString() + suffix;
                    }
                }
            }

            requestAnimationFrame(updateCounter);
        }

        // Hero 區塊滾動動畫觀察器
        function initHeroAnimations() {
            // 檢查是否支援 IntersectionObserver
            if (!('IntersectionObserver' in window)) {
                // 降級處理：直接顯示所有元素
                document.querySelectorAll('.animate-on-scroll, .stat-item, .hero-solution').forEach(el => {
                    el.classList.add('animated');
                });
                return;
            }

            const observerOptions = {
                threshold: 0.2,
                rootMargin: '0px 0px -50px 0px'
            };

            const heroObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting && !entry.target.classList.contains('animated')) {
                        entry.target.classList.add('animated');

                        // 如果是統計項目，觸發計數動畫
                        if (entry.target.classList.contains('stat-item')) {
                            const counter = entry.target.querySelector('.stat-number');
                            if (counter && counter.dataset.target) {
                                setTimeout(() => {
                                    animateCounter(counter);
                                }, parseFloat(getComputedStyle(entry.target).getPropertyValue('--delay') || 0) * 1000 + 300);
                            }
                        }
                    }
                });
            }, observerOptions);

            // 觀察所有需要動畫的元素
            document.querySelectorAll('.animate-on-scroll, .stat-item, .hero-solution').forEach(el => {
                heroObserver.observe(el);
            });
        }

        // 從 URL 獲取錨點，決定要載入哪個頁面
        function getAnchorFromUrl() {
            var hash = window.location.hash;
            if (hash) {
                var fullAnchor = hash.substring(1); // 移除 # 符號
                // 檢查是否包含子錨點 (如 cards/traffic-manipulation)
                if (fullAnchor.indexOf('/') > -1) {
                    return fullAnchor.split('/')[0]; // 返回主頁面 (cards)
                }
                return fullAnchor;
            }
            return 'home'; // 預設首頁
        }

        // 從 URL 獲取子錨點
        function getSubAnchorFromUrl() {
            var hash = window.location.hash;
            if (hash) {
                var fullAnchor = hash.substring(1);
                if (fullAnchor.indexOf('/') > -1) {
                    return fullAnchor.split('/')[1]; // 返回子錨點
                }
            }
            return null;
        }

        // 載入指定頁面
        function loadPage(target, subAnchor) {
            var filename = 'nav-' + target + '.html';
            // 加上時間戳避免緩存
            var timestamp = new Date().getTime();
            var url = filename + '?v=' + timestamp;

            $('#' + target).load(url, function(response, status, xhr) {
                if (status == "error") {
                    $('#' + target).html('<p>載入失敗：' + xhr.status + ' ' + xhr.statusText + '</p>');
                } else {
                    // 載入成功後，執行頁面特定的初始化
                    if (target === 'bamian') {
                        // 重新初始化大罷免頁面的動畫
                        setTimeout(function() {
                            initScrollAnimations();
                        }, 200);
                    }
                    // 如果有子錨點，滾動到該位置
                    if (subAnchor) {
                        setTimeout(function() {
                            var element = document.getElementById(subAnchor);
                            if (element) {
                                element.scrollIntoView({ behavior: 'smooth', block: 'start' });
                            }
                        }, 300);
                    }
                    // 首頁動畫初始化由 nav-home.html 內建 script 處理
                }
            });
        }

        // 切換到指定頁面
        function switchToPage(target, subAnchor) {
            // 移除所有 active 類別
            $('.nav-tab').removeClass('active');
            $('.content-section').removeClass('active');

            // 添加 active 類別到對應的標籤和內容
            $('.nav-tab[data-target="' + target + '"]').addClass('active');
            $('#' + target).addClass('active');

            // 載入頁面內容
            loadPage(target, subAnchor);

            // 更新 URL 錨點
            if (subAnchor) {
                window.location.hash = '#' + target + '/' + subAnchor;
            } else {
                window.location.hash = '#' + target;
            }
        }

        // 頁面載入時根據 URL 錨點載入對應頁面
        var initialPage = getAnchorFromUrl();
        var initialSubAnchor = getSubAnchorFromUrl();
        switchToPage(initialPage, initialSubAnchor);

        // 滾動到頁面頂部（h1 位置）
        setTimeout(function() {
            var topAnchor = document.getElementById('top-anchor');
            if (topAnchor) {
                topAnchor.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        }, 100);
        
        // 導航標籤點擊事件
        $('.nav-tab').click(function() {
            var target = $(this).data('target');
            switchToPage(target);
        });
        
        // 監聽瀏覽器前進/後退按鈕
        $(window).on('hashchange', function() {
            var target = getAnchorFromUrl();
            var subAnchor = getSubAnchorFromUrl();
            switchToPage(target, subAnchor);
        });

        // 可展開/收合區塊的點擊事件（使用事件委派）
        $(document).on('click', '.item-header', function() {
            var $header = $(this);
            var $content = $header.next('.item-content');
            
            // 切換展開/收合狀態
            $header.toggleClass('active');
            $content.toggleClass('active');
        });

        // 平滑滾動效果
        $(document).on('click', 'a[href^="#"]', function(e) {
            e.preventDefault();
            var target = $($(this).attr('href'));
            if (target.length) {
                $('html, body').animate({
                    scrollTop: target.offset().top - 100
                }, 800);
            }
        });

        // 滾動時添加視差效果 & 懸浮按鈕顯示
        $(window).scroll(function() {
            var scrolled = $(window).scrollTop();
            var parallax = scrolled * 0.5;
            $('body').css('background-position', '0 ' + parallax + 'px');

            // 懸浮返回導航按鈕顯示/隱藏
            var navTabs = $('#nav-tabs-anchor');
            if (navTabs.length) {
                var navTabsBottom = navTabs.offset().top + navTabs.outerHeight();
                if (scrolled > navTabsBottom) {
                    $('#back-to-nav').addClass('visible');
                } else {
                    $('#back-to-nav').removeClass('visible');
                }
            }
        });

        // 懸浮按鈕點擊事件
        $('#back-to-nav').click(function() {
            var navTabs = $('#nav-tabs-anchor');
            if (navTabs.length) {
                $('html, body').animate({
                    scrollTop: navTabs.offset().top - 20
                }, 500);
            }
        });

        // 載入動畫
        $('.content-section.active').addClass('loaded');
        
        // 添加懸停效果
        $(document).on('mouseenter', '.video-card, .book-card', function() {
            $(this).addClass('hover-effect');
        }).on('mouseleave', '.video-card, .book-card', function() {
            $(this).removeClass('hover-effect');
        });

        // 影片大綱展開/收合功能（使用事件委派）
        $(document).on('click', '.outline-toggle-btn', function() {
            var $button = $(this);
            var $buttonText = $button.find('span');
            var $outline = $button.parent().next('.video-outline');
            
            if ($outline.is(':hidden')) {
                $outline.show();
                $buttonText.text('收起大綱');
                $button.addClass('active');
            } else {
                $outline.hide();
                $buttonText.text('觀看影片大綱');
                $button.removeClass('active');
            }
        });

        // 時間軸節點hover效果（使用事件委派）
        $(document).on('mouseenter', '.timeline-node', function() {
            $(this).addClass('glow');
        }).on('mouseleave', '.timeline-node', function() {
            $(this).removeClass('glow');
        });

        // 新增滾動動畫初始化
        setTimeout(function() {
            initScrollAnimations();
        }, 500);

        // 頁面切換時重新初始化動畫
        $('.nav-tab').click(function() {
            var target = $(this).data('target');
            switchToPage(target);
            
            // 如果切換到大罷免頁面，重新初始化動畫
            if (target === 'bamian') {
                setTimeout(function() {
                    initScrollAnimations();
                }, 600);
            }
        });



        // 滾動動畫觀察器
        function initScrollAnimations() {
            const observerOptions = {
                threshold: 0.1,
                rootMargin: '0px 0px -50px 0px'
            };

            const observer = new IntersectionObserver(function(entries) {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('animate-in');
                    }
                });
            }, observerOptions);

            // 觀察所有需要動畫的元素
            const animateElements = document.querySelectorAll('.timeline-item, .urgent-warning-card, .bamian-title');
            animateElements.forEach(el => {
                observer.observe(el);
            });
        }

        // 新增滾動動畫初始化
        setTimeout(function() {
            initScrollAnimations();
        }, 500);

        // 頁面切換時重新初始化動畫
        $('.nav-tab').click(function() {
            var target = $(this).data('target');
            switchToPage(target);
            
            // 如果切換到大罷免頁面，重新初始化動畫
            if (target === 'bamian') {
                setTimeout(function() {
                    initScrollAnimations();
                }, 600);
            }
        });

        // 短影音相關功能
        window.toggleMoreVideos = function() {
            const btn = $('.expand-videos-btn');
            const content = $('.more-videos-content');
            const expandText = $('.expand-text');
            
            if (content.is(':visible')) {
                content.removeClass('show');
                setTimeout(() => {
                    content.hide();
                }, 500);
                expandText.text('顯示更多影片');
                btn.removeClass('expanded');
            } else {
                content.show();
                setTimeout(() => {
                    content.addClass('show');
                }, 10);
                expandText.text('收起影片');
                btn.addClass('expanded');
            }
        };


    });
    </script>
</body>
</html>
